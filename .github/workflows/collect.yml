name: Collect events

on:
  schedule:
    # Every day at 04:15 UTC (05:15/06:15 in Germany depending on DST).
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma separated source slugs (empty = all)'
        required: false
        default: ''

concurrency:
  group: chronik-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run collector tests
        run: python -m unittest discover -s backend/tests -v

      - name: Restore crawler cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: chronik-cache-${{ github.run_id }}
          restore-keys: |
            chronik-cache-

      - name: Collect and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CRAWLER_USER_AGENT: ChronikBot/1.0 (+https://chronik.events/bot; mailto:${{ secrets.CONTACT_EMAIL }})
        run: |
          python -m backend.pipeline --publish --out backend/data/events.json

      - name: Upload run artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronik-events-${{ github.run_id }}
          path: backend/data/events.json
          if-no-files-found: ignore
          retention-days: 14
