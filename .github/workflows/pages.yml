name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: crawler-${{ github.run_id }}
          restore-keys: crawler-
      - name: Collect real events without AI
        run: |
          pip install -r backend/requirements.txt
          python -m unittest discover -s backend/tests -v
          python -m backend.pipeline --no-ai --out public/events.json

      - name: Build static PWA
        env:
          # Anon key is public by design; RLS protects writes. Set these as
          # repository Variables (Settings → Secrets and variables → Actions).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # First push should not require a manual trip to Settings → Pages.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
